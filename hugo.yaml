baseurl: https://www.chabing.net/
locale: zh-CN
theme: Stack
title: 茶冰の小破站
copyright: 茶冰の小破站

# Theme i18n support (v4)
# Available values: ar be bg bn ca cs de el en es fa fr hi hu id it ja ko nl oc pl pt-br pt-pt ru sk th tr uk vi zh zh-hant-hk zh-hant-tw
DefaultContentLanguage: zh

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
    zh:
        label: 中文
        title: 茶冰の小破站
        weight: 2
        params:
            sidebar:
                subtitle: 一个分享经验与技术的小破站
services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

pagination:
    pagerSize: 5

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    rssFullContent: true
    favicon: favicon.ico # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2025
        customText: <a href="https://ipv6test.wcode.net/?q=www.chabing.net" target="_blank">本站已支持IPV6访问</a> <a href="https://http3.wcode.net/?q=www.chabing.net" target="_blank">本站已支持HTTP/3</a><br><a href="https://beian.miit.gov.cn/" target="_blank">新ICP备2025019760号-1</a><br><a href="https://beian.mps.gov.cn/#/query/webSearch?code=65280102000190" rel="noreferrer" target="_blank">新公网安备65280102000190号</a>

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 
        subtitle: 一个分享经验与技术的小破站
        avatar: img/avatar.jpg

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-SA 4.0

    comments:
        enabled: true
        provider: twikoo

        twikoo:
            envId: https://twikoo.chabing.net
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            #- type: tag-cloud
            #  params:
            #      limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        content:
            enabled: true
### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []

    social:
        - identifier: 1bilibili
          name: 1:bilibili
          url: https://space.bilibili.com/1302913521
          params:
              newTab: true
              icon: brand-bilibili

        - identifier: telegram
          name: 2:telegram
          url: https://t.me/chabingovo
          params:
              newTab: true
              icon: brand-telegram

        -  identifier: email
           name: 3:email
           url: mailto:chabing@duck.com
           params:
               newTab: true
               icon: mail

        -  identifier: rss
           name: 4:rss
           url: /index.xml
           params:
              newTab: true
              icon: rss


related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 1
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
